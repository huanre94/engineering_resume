design:
  theme: "engineeringresumes"
  page:
    size: "us-letter"
    top_margin: "2cm"
    bottom_margin: "2cm"
    left_margin: "2cm"
    right_margin: "2cm"
    show_page_numbering: false
    show_last_updated_date: true
  colors:
    text: "rgb(0, 0, 0)"
    name: "rgb(0, 79, 144)"
