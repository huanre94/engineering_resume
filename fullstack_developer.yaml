design:
  theme: "engineeringresumes"
  page:
    size: "us-letter"
    top_margin: "2cm"
    bottom_margin: "2cm"
    left_margin: "2cm"
    right_margin: "2cm"
    show_footer: false
    show_top_note: true
  colors:
    body: "rgb(0, 0, 0)"
    name: "rgb(0, 79, 144)"
    headline: "rgb(0, 79, 144)"
    connections: "rgb(0, 79, 144)"
    section_titles: "rgb(0, 79, 144)"
    links: "rgb(0, 79, 144)"
    top_note: "rgb(128, 128, 128)"
  typography:
    line_spacing: "0.6em"
    alignment: "justified"
    date_and_location_column_alignment: "right"
    font_family:
      body: "Raleway"
      name: "Raleway"
      headline: "Raleway"
      connections: "Raleway"
      section_titles: "Raleway"
    font_size:
      body: "10pt"
      name: "30pt"
      headline: "10pt"
      connections: "10pt"
      section_titles: "1.4em"
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: false
      connections: false
      section_titles: false
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: "left"
    photo_width: "3.5cm"
    space_below_name: "0.2cm"
    space_below_headline: "0.2cm"
    space_below_connections: "0.7cm"
    connections:
      separator: ""
      show_icons: false
      display_urls_instead_of_usernames: false
      hyperlink: true
      phone_number_format: national
      space_between_connections: "0.5cm"
  section_titles:
    type: "with_partial_line"
    line_thickness: "0.5pt"
    space_above: "0.5cm"
    space_below: "0.3cm"
  sections:
    allow_page_break: true
    space_between_regular_entries: "1.2em"
    space_between_text_based_entries: "0.3em"
    show_time_spans_in: []
  entries:
    date_and_location_width: "4.15cm"
    side_space: "0.2cm"
    space_between_columns: "0.1cm"
    allow_page_break: true
    short_second_row: false
    degree_width: "1cm"
    summary:
      space_above: "0cm"
      space_left: "0cm"
    highlights:
      bullet: "•"
      nested_bullet: "-"
      space_above: "0.25cm"
      space_left: "0cm"
      space_between_items: "0.25cm"
      space_between_bullet_and_text: "0.5em"
  templates:
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: |-
        **INSTITUTION**, AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column: "**DEGREE**"
      date_and_location_column: "DATE"
    normal_entry:
      main_column: |-
        **NAME** -- **LOCATION**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: "DATE"
    experience_entry:
      main_column: |-
        **POSITION**, COMPANY -- LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: "DATE"
    publication_entry:
      main_column: |-
        **TITLE**
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: "DATE"
locale:
  language: "spanish"
settings:
  current_date: "today"
  render_command:
    output_folder: "rendercv_output"
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_png: true
  bold_keywords: []
